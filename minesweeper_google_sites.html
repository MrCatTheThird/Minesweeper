<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e9eef5;
    font-family: Arial, sans-serif;
    color: #172033;
    padding: 16px;
  }
  .game {
    width: min(96vw, 620px);
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  h1 { text-align: center; margin: 0 0 12px; font-size: 28px; }
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  select, button {
    font: inherit;
    border: 1px solid #b8c2d1;
    border-radius: 9px;
    padding: 8px 12px;
    background: #f8fafc;
    cursor: pointer;
  }
  button:hover, select:hover { filter: brightness(.97); }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    background: #f1f5f9;
    border-radius: 10px;
    padding: 9px 12px;
    margin-bottom: 12px;
    font-weight: bold;
  }
  #board {
    display: grid;
    gap: 2px;
    justify-content: center;
    background: #94a3b8;
    padding: 3px;
    border-radius: 7px;
    overflow: auto;
    max-width: 100%;
  }
  .cell {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    border-radius: 3px;
    background: #cbd5e1;
    font-weight: 900;
    font-size: 16px;
    user-select: none;
    touch-action: manipulation;
  }
  .cell:hover { background: #dbe3ec; }
  .cell.revealed {
    background: #f8fafc;
    cursor: default;
  }
  .cell.mine { background: #fecaca; }
  .cell.flag { background: #fde68a; }
  .n1 { color:#2563eb; }
  .n2 { color:#15803d; }
  .n3 { color:#dc2626; }
  .n4 { color:#7c3aed; }
  .n5 { color:#92400e; }
  .n6 { color:#0891b2; }
  .n7 { color:#111827; }
  .n8 { color:#64748b; }
  #message {
    min-height: 24px;
    text-align: center;
    font-weight: bold;
    margin-top: 12px;
  }
  .hint {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin: 8px 0 0;
  }
  @media (max-width: 480px) {
    .cell { width: 26px; height: 26px; font-size: 14px; }
    .game { padding: 12px; }
  }
</style>
</head>
<body>
<div class="game">
  <h1>💣 Minesweeper</h1>

  <div class="controls">
    <label>
      Difficulty:
      <select id="difficulty">
        <option value="easy">Easy — 9×9, 10 mines</option>
        <option value="medium">Medium — 16×16, 40 mines</option>
        <option value="hard">Hard — 30×16, 99 mines</option>
      </select>
    </label>
    <button id="newGame">🔄 New Game</button>
  </div>

  <div class="stats">
    <span>💣 Mines: <span id="mines">10</span></span>
    <span>🚩 Flags: <span id="flags">0</span></span>
    <span>⏱️ Time: <span id="time">0</span></span>
  </div>

  <div id="board" aria-label="Minesweeper board"></div>
  <div id="message">Click a square to start!</div>
  <div class="hint">Right-click to flag on a computer. On mobile, long-press a square to flag it.</div>
</div>

<script>
const settings = {
  easy:   { rows: 9,  cols: 9,  mines: 10 },
  medium: { rows: 16, cols: 16, mines: 40 },
  hard:   { rows: 16, cols: 30, mines: 99 }
};

const boardEl = document.getElementById("board");
const difficultyEl = document.getElementById("difficulty");
const minesEl = document.getElementById("mines");
const flagsEl = document.getElementById("flags");
const timeEl = document.getElementById("time");
const messageEl = document.getElementById("message");
const newGameBtn = document.getElementById("newGame");

let state = {};

function newGame() {
  const s = settings[difficultyEl.value];
  state = {
    rows: s.rows,
    cols: s.cols,
    mines: s.mines,
    cells: [],
    flags: 0,
    revealed: 0,
    started: false,
    over: false,
    timer: 0,
    timerId: null
  };

  clearInterval(state.timerId);
  boardEl.innerHTML = "";
  boardEl.style.gridTemplateColumns = `repeat(${state.cols}, 30px)`;

  // Build empty board. Mines are placed after the first click so the
  // player's first click is always safe.
  for (let r = 0; r < state.rows; r++) {
    state.cells[r] = [];
    for (let c = 0; c < state.cols; c++) {
      const cell = {
        mine: false,
        revealed: false,
        flagged: false,
        number: 0,
        el: document.createElement("button")
      };
      cell.el.className = "cell";
      cell.el.setAttribute("aria-label", `Row ${r+1}, column ${c+1}`);
      cell.el.dataset.r = r;
      cell.el.dataset.c = c;
      state.cells[r][c] = cell;
      boardEl.appendChild(cell.el);
    }
  }

  minesEl.textContent = state.mines;
  flagsEl.textContent = "0";
  timeEl.textContent = "0";
  messageEl.textContent = "Click a square to start!";
}

function neighbors(r, c) {
  const list = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < state.rows && nc >= 0 && nc < state.cols) {
        list.push([nr, nc]);
      }
    }
  }
  return list;
}

function placeMines(safeR, safeC) {
  const forbidden = new Set([`${safeR},${safeC}`]);
  // Also avoid neighbors when possible, making the opening friendlier.
  for (const [r,c] of neighbors(safeR, safeC)) forbidden.add(`${r},${c}`);

  let available = [];
  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      if (!forbidden.has(`${r},${c}`)) available.push([r,c]);
    }
  }

  // If the board is too small for the protected area, only protect first cell.
  if (available.length < state.mines) {
    available = [];
    for (let r = 0; r < state.rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        if (!(r === safeR && c === safeC)) available.push([r,c]);
      }
    }
  }

  for (let i = available.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [available[i], available[j]] = [available[j], available[i]];
  }

  for (let i = 0; i < state.mines; i++) {
    const [r,c] = available[i];
    state.cells[r][c].mine = true;
  }

  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      if (state.cells[r][c].mine) continue;
      state.cells[r][c].number =
        neighbors(r,c).filter(([nr,nc]) => state.cells[nr][nc].mine).length;
    }
  }
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timer++;
    timeEl.textContent = state.timer;
  }, 1000);
}

function reveal(r, c) {
  if (state.over) return;
  const cell = state.cells[r][c];
  if (cell.revealed || cell.flagged) return;

  if (!state.started) {
    state.started = true;
    placeMines(r, c);
    startTimer();
  }

  if (cell.mine) {
    cell.revealed = true;
    cell.el.classList.add("revealed", "mine");
    cell.el.textContent = "💣";
    lose();
    return;
  }

  floodReveal(r, c);
  checkWin();
}

function floodReveal(startR, startC) {
  const queue = [[startR, startC]];
  const seen = new Set();

  while (queue.length) {
    const [r,c] = queue.shift();
    const key = `${r},${c}`;
    if (seen.has(key)) continue;
    seen.add(key);

    const cell = state.cells[r][c];
    if (cell.revealed || cell.flagged || cell.mine) continue;

    cell.revealed = true;
    state.revealed++;
    cell.el.classList.add("revealed");

    if (cell.number > 0) {
      cell.el.textContent = cell.number;
      cell.el.classList.add(`n${cell.number}`);
    } else {
      for (const [nr,nc] of neighbors(r,c)) {
        const next = state.cells[nr][nc];
        if (!next.revealed && !next.mine && !next.flagged) {
          queue.push([nr,nc]);
        }
      }
    }
  }
}

function toggleFlag(r, c) {
  if (state.over) return;
  const cell = state.cells[r][c];
  if (cell.revealed) return;

  cell.flagged = !cell.flagged;
  cell.el.classList.toggle("flag", cell.flagged);
  cell.el.textContent = cell.flagged ? "🚩" : "";
  state.flags += cell.flagged ? 1 : -1;
  flagsEl.textContent = state.flags;
  checkWin();
}

function lose() {
  state.over = true;
  clearInterval(state.timerId);

  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      const cell = state.cells[r][c];
      if (cell.mine) {
        cell.revealed = true;
        cell.el.classList.add("revealed", "mine");
        cell.el.textContent = "💣";
      }
    }
  }
  messageEl.textContent = "💥 Game over! Try again.";
}

function checkWin() {
  if (state.revealed === state.rows * state.cols - state.mines) {
    state.over = true;
    clearInterval(state.timerId);

    for (let r = 0; r < state.rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        const cell = state.cells[r][c];
        if (cell.mine && !cell.flagged) {
          cell.flagged = true;
          cell.el.classList.add("flag");
          cell.el.textContent = "🚩";
        }
      }
    }
    state.flags = state.mines;
    flagsEl.textContent = state.flags;
    messageEl.textContent = `🎉 You won in ${state.timer} seconds!`;
  }
}

// Mouse controls
boardEl.addEventListener("click", e => {
  const el = e.target.closest(".cell");
  if (!el) return;
  reveal(Number(el.dataset.r), Number(el.dataset.c));
});

boardEl.addEventListener("contextmenu", e => {
  const el = e.target.closest(".cell");
  if (!el) return;
  e.preventDefault();
  toggleFlag(Number(el.dataset.r), Number(el.dataset.c));
});

// Mobile long-press to flag
let pressTimer = null;
let longPressed = false;

boardEl.addEventListener("touchstart", e => {
  const el = e.target.closest(".cell");
  if (!el) return;
  longPressed = false;
  pressTimer = setTimeout(() => {
    longPressed = true;
    toggleFlag(Number(el.dataset.r), Number(el.dataset.c));
    if (navigator.vibrate) navigator.vibrate(30);
  }, 550);
}, {passive: true});

boardEl.addEventListener("touchend", () => {
  clearTimeout(pressTimer);
}, {passive: true});

boardEl.addEventListener("touchmove", () => {
  clearTimeout(pressTimer);
}, {passive: true});

newGameBtn.addEventListener("click", newGame);
difficultyEl.addEventListener("change", newGame);

newGame();
</script>
</body>
</html>
